<!-- PWA Install Prompt & Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('SW registered!', reg);
            }).catch(err => console.log('SW registration failed', err));
        });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showPwaToast();
    });

    function showPwaToast() {
        if (document.getElementById('pwa-install-toast')) return;
        
        const toastHtml = `
            <div id="pwa-install-toast" style="position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 150%); opacity: 0; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 99999; background: #fff; border: 2px solid #0b0b0b; box-shadow: 4px 4px 0 0 #0b0b0b; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 92vw; width: 380px; font-family: 'JetBrains Mono', monospace;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="background: #0b0b0b; padding: 6px; border: 2px solid #0b0b0b;">
                        <img src="/logo.png" alt="Logo" style="width: 24px; height: 24px; object-fit: contain;">
                    </div>
                    <div>
                        <h4 style="margin: 0; font-size: 13px; font-weight: 800; color: #0b0b0b; text-transform: uppercase;">Install Admin App</h4>
                        <p style="margin: 2px 0 0; font-size: 11px; color: #404040; font-weight: 600;">Standalone Desktop / Mobile Access</p>
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-pwa-dismiss" aria-label="Dismiss install" style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: #0b0b0b; font-weight: bold; padding: 0 4px;">&times;</button>
                    <button id="btn-pwa-install" class="btn-primary" style="padding: 6px 12px; font-size: 11px;">Install</button>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', toastHtml);
        
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const toast = document.getElementById('pwa-install-toast');
                if (toast) {
                    toast.style.transform = 'translate(-50%, 0)';
                    toast.style.opacity = '1';
                }
            });
        });

        document.getElementById('btn-pwa-dismiss').addEventListener('click', () => {
            const toast = document.getElementById('pwa-install-toast');
            toast.style.transform = 'translate(-50%, 150%)';
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 400);
        });

        document.getElementById('btn-pwa-install').addEventListener('click', async () => {
            document.getElementById('pwa-install-toast').remove();
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
        });
    }
</script>
