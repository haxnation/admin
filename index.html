<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haxnation Admin Portal</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="manifest" href="/favicons/site.webmanifest">
    <link rel="shortcut icon" href="/favicons/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/aws-intercept.js"></script>
    <style>
        .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
    
    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-6">
                <a href="#/dashboard" class="text-xl font-bold tracking-tight"><img src="/logo.png" alt="Haxnation Admin" class="h-8 w-auto"></a>
                <a href="#/minigames" class="text-sm text-gray-300 hover:text-white transition hidden md:block" id="nav-minigames">Mini-Games</a>
                <a href="#/b2b-admin" class="text-sm text-gray-300 hover:text-white transition hidden md:block" id="nav-b2b-admin">B2B Admin</a>
                <a href="api-docs.html" target="_blank" class="text-sm text-gray-300 hover:text-white transition hidden md:block" id="nav-api-docs">API Docs</a>
            </div>
            <div id="nav-user" class="flex gap-4 items-center hidden">
                <span id="user-name" class="text-sm opacity-80">Loading...</span>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded transition">Logout</button>
            </div>
        </div>
    </nav>

    <div id="app" class="container mx-auto p-6">
        <div class="flex justify-center mt-20"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div></div>
    </div>

    <div id="modals"></div>

    <script src="js/CertificateGenerator.js"></script>
    <script type="module" src="js/app.js"></script>

<!-- PWA Install Prompt & Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('SW registered!', reg);
            }).catch(err => console.log('SW registration failed', err));
        });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showPwaToast();
    });

    function showPwaToast() {
        if (document.getElementById('pwa-toast')) return;
        
        const toastHtml = `
            <div id="pwa-toast" style="position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 999999; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 90vw; max-width: 384px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
                <button onclick="document.getElementById('pwa-toast').remove()" style="position: absolute; top: 8px; right: 8px; background: transparent; border: none; font-size: 16px; cursor: pointer; color: #9ca3af; padding: 4px; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;">&times;</button>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="/logo.png" alt="Logo" style="width: 40px; height: 40px; object-fit: contain; flex-shrink: 0;">
                    <div style="display: flex; flex-direction: column;">
                        <h4 style="margin: 0; font-size: 14px; font-weight: 700; color: #111827;">Install Haxnation Admin</h4>
                        <p style="margin: 2px 0 0; font-size: 12px; color: #6b7280;">Add to Home Screen</p>
                    </div>
                </div>
                <button id="btn-pwa-install" style="background: #1a73e8; color: #ffffff; border: none; border-radius: 6px; padding: 8px 16px; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;">Install</button>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', toastHtml);

        document.getElementById('btn-pwa-install').addEventListener('click', async () => {
            document.getElementById('pwa-toast').remove();
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
            }
        });
    }
</script>

</body>
</html>
